[package]
name = "arthmitra"
version = "0.1.0"
description = "ArthMitra — Offline Autonomous Accounting Platform for India"
authors = ["ArtMitra Team"]
edition = "2021"
default-run = "arthmitra"

[lib]
name = "arthmitra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
directories = "6"
notify = "7"
regex = "1"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2"
bcrypt = "0.15"
calamine = "0.33.0"
csv = "1.4.0"
